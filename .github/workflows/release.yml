name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # npm CLI is used only for the OIDC trusted-publish handshake,
      # which requires npm >= 11.5.1.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build library
        run: bun run build --filter=@mxv/ui

      # No NPM_TOKEN: the token is minted from the id-token permission via
      # the trusted publisher configured on npmjs.com. Provenance is automatic.
      - name: Publish
        run: npm publish
        working-directory: packages/ui
