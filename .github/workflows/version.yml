name: Version

on:
  push:
    branches: [main]

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PAT (not GITHUB_TOKEN) so the tag we push below can trigger release.yml.
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      # When changesets exist: opens/updates the "Version Packages" PR.
      # When none exist (i.e. that PR was just merged): does nothing, and
      # hasChangesets is "false" so the tag step runs.
      - name: Create version PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag release
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          version=$(node -p "require('./packages/ui/package.json').version")
          tag="v$version"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists, skipping."
          else
            git tag "$tag"
            git push origin "$tag"
          fi
